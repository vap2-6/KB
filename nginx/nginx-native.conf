worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    upstream backend_server {
        server 127.0.0.1:5000;
    }

    server {
        listen 8080;
        server_name localhost;

        client_max_body_size 20M;

        # 1. Reverse Proxy API Requests to Python Backend
        location /api/ {
            proxy_pass http://127.0.0.1:5000/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # 2. Static SPA Frontend Routing
        location /admin/ {
            alias ../frontend-admin/dist/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        location /admin-login/ {
            alias ../frontend-admin/dist/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        location /staff/ {
            alias ../frontend-staff/dist/;
            index index.html;
            try_files $uri $uri/ /staff/index.html;
        }

        location /canteen/ {
            alias ../frontend-canteen/dist/;
            index index.html;
            try_files $uri $uri/ /canteen/index.html;
        }

        location /student/ {
            alias ../frontend-stud/dist/;
            index index.html;
            try_files $uri $uri/ /student/index.html;
        }

        location /register/ {
            alias ../frontend-reg/dist/;
            index index.html;
            try_files $uri $uri/ /register/index.html;
        }

        # 3. Uploads & Generated PDFs
        location /uploads/ {
            alias ../backend/registration_backend/uploads/;
        }

        location /generated_pdfs/ {
            alias ../backend/registration_backend/generated_pdfs/;
        }

        # 4. Fallback Landing Page
        location / {
            proxy_pass http://127.0.0.1:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
