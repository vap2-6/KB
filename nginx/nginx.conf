upstream backend_server {
    server backend:5000 max_fails=1 fail_timeout=2s;
    server host.docker.internal:5000 backup;
    server 127.0.0.1:5000 backup;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    # Enable Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # 1. Reverse Proxy API Requests to Flask/Gunicorn Backend
    location /api/ {
        proxy_pass http://backend_server/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # 2. Static SPA Frontend Routing

    # Admin Frontend
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /admin-login/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Staff Frontend
    location /staff/ {
        alias /usr/share/nginx/html/staff/;
        index index.html;
        try_files $uri $uri/ /staff/index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Canteen Frontend
    location /canteen/ {
        alias /usr/share/nginx/html/canteen/;
        index index.html;
        try_files $uri $uri/ /canteen/index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Student Frontend
    location /student/ {
        alias /usr/share/nginx/html/student/;
        index index.html;
        try_files $uri $uri/ /student/index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Registration Frontend
    location /register/ {
        alias /usr/share/nginx/html/register/;
        index index.html;
        try_files $uri $uri/ /register/index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 3. Static Media Files & Generated PDFs
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /generated_pdfs/ {
        alias /usr/share/nginx/html/generated_pdfs/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # 4. Landing Page / Root Redirects
    location / {
        proxy_pass http://backend_server/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
